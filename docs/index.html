<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Availability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="client.css">
</head>
<body>
  <div class="trail" id="trail"></div>
  <div class="wrap">
    <section class="hero">
      <div class="photo" id="photo" hidden></div>
      <div class="motifs" id="motifs"></div>
      <div class="art" id="heroArt"></div>
      <span class="eyebrow">Availability</span>
      <h1 id="title">Pet Sitting Availability</h1>
      <p id="message"></p>
    </section>

    <p class="rate-note" id="rateNote" hidden></p>

    <h2 class="t"><span class="n">01</span>Pick your dates</h2>
    <div class="checker sticker" id="checker"></div>

    <h2 class="t"><span class="n">02</span>Calendar</h2>
    <div class="legend-top">
      <span><b class="s-open">○</b>Open</span>
      <span><b class="s-limited">△</b>Limited — tap for details</span>
      <span><b class="s-booked">×</b>Booked</span>
      <span><b class="s-off">Off</b>Day off</span>
    </div>
    <div class="months" id="months"></div>

    <div class="foot"><div class="art" id="footArt"></div><span id="updated"></span></div>
  </div>
  <a class="cta" id="contact" hidden></a>

  <script src="common.js"></script>
  <script src="art.js"></script>
  <script src="seasons.js"></script>
  <script>
  (async function () {
    let data;
    try {
      const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
      data = PS.normalize(await res.json());
    } catch (e) {
      data = PS.normalize(null);
    }
    const st = data.settings;
    const en = st.en;

    /* ---------- hero & season ---------- */
    document.title = en.title || 'Availability';
    document.getElementById('title').textContent = en.title || 'Pet Sitting Availability';
    document.getElementById('message').textContent = en.message || '';
    if (en.rateNote) { const r = document.getElementById('rateNote'); r.textContent = en.rateNote; r.hidden = false; }

    const q = new URLSearchParams(location.search).get('month');
    const season = PSSEASON.pick(st.season, new Date(), q);
    const root = document.documentElement.style;
    root.setProperty('--hero-bg', season.bg);
    root.setProperty('--hero-ink', season.ink);
    root.setProperty('--accent', season.accent);
    document.querySelector('.hero .eyebrow').textContent = season.line;
    document.getElementById('heroArt').innerHTML =
      `<span class="cat">${PSART.cat(season.cat ? season.cat() : '')}</span><span class="dog">${PSART.dog(season.dog ? season.dog() : '')}</span>`;
    document.getElementById('motifs').innerHTML = season.motifs.map(([k, c, x, y, size, r]) =>
      `<span style="left:${x}%;top:${y}%;width:calc(${size}px * var(--ms));height:calc(${size}px * var(--ms));--r:${r}deg">${PSART.motif(k, c)}</span>`).join('');
    if (st.heroImage) {
      const ph = document.getElementById('photo');
      ph.style.backgroundImage = `url("${String(st.heroImage).replace(/["\\]/g, '')}")`;
      ph.hidden = false;
      document.getElementById('heroArt').hidden = true;
    }
    document.getElementById('footArt').innerHTML = PSART.PAW + PSART.PAW;
    (function trail() {
      const el = document.getElementById('trail');
      let h = '';
      for (let i = 0; i < 9; i++) {
        const x = 6 + i * 11 + (i % 2 ? 3 : -3), y = 18 + i * 9;
        h += `<span style="position:absolute;left:${x}%;top:${y}%;width:30px;height:30px;transform:rotate(${35 + (i % 2 ? 18 : -10)}deg)">${PSART.PAW}</span>`;
      }
      el.innerHTML = h;
    })();

    if (st.contactUrl) {
      const a = document.getElementById('contact');
      a.href = st.contactUrl;
      a.textContent = (en.contactLabel || 'Message me') + '  →';
      a.target = '_blank';
      a.rel = 'noopener';
      a.hidden = false;
    }
    if (data.updatedAt) {
      const u = new Date(data.updatedAt);
      document.getElementById('updated').textContent =
        `Updated ${PS.MONTH_EN[u.getMonth()]} ${u.getDate()}, ${PS.pad(u.getHours())}:${PS.pad(u.getMinutes())} · Bookings are confirmed directly with me.`;
    }

    /* ---------- calendar ---------- */
    const today = PS.today();
    const t0 = PS.parse(today);
    const monthsAhead = Math.max(1, Number(st.monthsAhead) || 3);
    const state = { start: null, end: null };
    const noteOf = (x) => x.noteEn || (x.status === 'limited' ? 'Limited availability, please ask' : '');

    function drawMonths() {
      let h = '';
      for (let i = 0; i < monthsAhead; i++) {
        const first = new Date(t0.getFullYear(), t0.getMonth() + i, 1);
        const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
        h += `<section class="month sticker"><h3>${PS.MONTH_EN_FULL[first.getMonth()]} <span>${first.getFullYear()}</span></h3><div class="grid">`;
        PS.WEEK_EN.forEach((w, j) => { h += `<div class="wd ${j === 0 || j === 6 ? 'we' : ''}">${w.slice(0, 2)}</div>`; });
        for (let k = 0; k < first.getDay(); k++) h += '<div class="day empty"></div>';
        for (let d = 1; d <= n; d++) {
          const date = PS.ymd(new Date(first.getFullYear(), first.getMonth(), d));
          const x = PS.dayInfo(data, date);
          const cls = ['day', 'st-' + x.status];
          if (x.past) cls.push('past');
          if (date === today) cls.push('today');
          if (state.start && date >= state.start && date <= (state.end || state.start)) cls.push('inrange');
          if (date === state.start || date === state.end) cls.push('sel');
          const sym = x.past ? '' : `<b>${PS.SYMBOL[x.status]}</b>`;
          const tip = !x.past && x.status === 'limited' ? ` title="${PS.esc(noteOf(x))}"` : '';
          h += `<button type="button" class="${cls.join(' ')}" data-d="${date}" ${x.past ? 'disabled' : ''}${tip}><span class="num">${d}</span>${sym}</button>`;
        }
        h += '</div></section>';
      }
      const el = document.getElementById('months');
      el.innerHTML = h;
      el.querySelectorAll('button[data-d]').forEach((b) => b.addEventListener('click', () => pick(b.dataset.d)));
    }

    function pick(d) {
      if (!state.start || state.end) { state.start = d; state.end = null; }
      else if (d < state.start) { state.start = d; }
      else { state.end = d; }
      draw();
      if (window.innerWidth < 700) document.getElementById('checker').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function drawChecker() {
      const el = document.getElementById('checker');
      if (!state.start) {
        el.innerHTML = '<p class="prompt"><b>Tap your first day</b> on the calendar below, then your last day. You\'ll see at a glance whether I\'m free.</p>';
        return;
      }
      const a = state.start, b = state.end || state.start;
      const days = [];
      for (let d = a; d <= b; d = PS.addDays(d, 1)) days.push(PS.dayInfo(data, d));
      const counts = { open: 0, limited: 0, booked: 0, off: 0 };
      days.forEach((x) => counts[x.status]++);
      let cls, head;
      if (counts.open === days.length) { cls = 'ok'; head = days.length > 1 ? 'I\'m open for all of these dates.' : 'I\'m open that day.'; }
      else if (counts.booked + counts.off === days.length) { cls = 'no'; head = days.length > 1 ? 'Sorry, I\'m not available for these dates.' : 'Sorry, I\'m not available that day.'; }
      else { cls = 'partial'; head = days.length > 1 ? 'Some of these dates have limits:' : 'That day has limits:'; }
      let html = `<div class="range">${PS.fmtDateEn(a)}${b > a ? ' → ' + PS.fmtDateEn(b) : ''}<small>${days.length} day${days.length > 1 ? 's' : ''}${state.end ? '' : ' · tap a last day'}</small></div>`;
      html += `<div class="res ${cls}"><div class="s">${head}</div>`;
      if (cls === 'partial' || (cls === 'no' && days.length > 1)) {
        // group consecutive days with the same status & note
        const groups = [];
        for (const x of days) {
          const key = x.status + '|' + noteOf(x);
          const g = groups[groups.length - 1];
          if (g && g.key === key) g.end = x.date; else groups.push({ key, start: x.date, end: x.date, x });
        }
        html += '<ul>' + groups.map((g) => {
          const when = g.start === g.end ? PS.fmtDateEn(g.start) : `${PS.fmtDateEn(g.start)} – ${PS.fmtDateEn(g.end)}`;
          const what = g.x.status === 'limited' ? noteOf(g.x) : PS.STATUS_EN[g.x.status];
          return `<li><span class="sym s-${g.x.status}">${PS.SYMBOL[g.x.status]}</span><b>${when}</b> ${PS.esc(what)}</li>`;
        }).join('') + '</ul>';
      }
      html += '</div><button type="button" class="btn-clear" id="clear">Clear dates</button>';
      el.innerHTML = html;
      document.getElementById('clear').addEventListener('click', () => { state.start = state.end = null; draw(); });
    }

    function draw() { drawMonths(); drawChecker(); }
    draw();
  })();
  </script>
</body>
</html>
